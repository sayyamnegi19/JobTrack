<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - JobTrack</title>
</head>
<body>

    <h1>Login to JobTrack</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'accounts:register' %}">
            Register
        </a>
    </p>

</body>
</html>
