<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} JobTrack {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% block extra_css %} {% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a href="{% url 'home' %}" class="navbar-brand fw-bold">
                JobTrack
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end text-bg-dark w-50" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">JobTrack</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <div class="navbar-nav justify-content-end flex-grow-1 pe-3 gap-lg-3">

                        {% if user.is_authenticated %}

                            <a href="{% url 'dashboard:dashboard' %}" class="nav-link link-light link-opacity-100 link-opacity-75-hover">
                                Dashboard
                            </a>

                            <a href="{% url 'applications:list' %}" class="nav-link link-light link-opacity-100 link-opacity-75-hover">
                                Applications
                            </a>

                            <a href="{% url 'applications:add' %}" class="nav-link link-light link-opacity-100 link-opacity-75-hover">
                                Add Applications
                            </a>

                            <a href="{% url 'accounts:logout' %}" class="nav-link link-light link-opacity-100 link-opacity-75-hover">
                                Logout
                            </a>
                        
                        {% else %}
                            
                            <a href="{% url 'accounts:login' %}" class="nav-link link-light link-opacity-100 link-opacity-75-hover">
                                Login
                            </a>

                            <a href="{% url 'accounts:register' %}" class="nav-link link-light link-opacity-100 link-opacity-75-hover">
                                Register
                            </a>

                        {% endif %}

                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}

        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
