{# Usage: {% include "includes/back_link.html" with url=... label=... %} #}
<div class="mb-4">
    <a href="{{ url }}" class="jt-back-link text-decoration-none small fw-semibold d-inline-flex align-items-center gap-2">
        <span class="jt-back-icon bg-body rounded-circle shadow-sm d-flex align-items-center justify-content-center">
            <i class="bi bi-arrow-left text-body"></i>
        </span>
        <span>{{ label }}</span>
    </a>
</div>
