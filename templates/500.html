{% extends "base.html" %}

{% block title %}
Server Error - JobTrack
{% endblock %}

{% block content %}
<div class="container-fluid flex-grow-1 d-flex align-items-center justify-content-center bg-body-tertiary py-5 px-3">
    <div class="text-center max-w-400">
        <div class="jt-empty-icon bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center fs-2 shadow-sm mb-3">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h1 class="display-5 fw-bold text-body mb-1">500</h1>
        <h2 class="h5 fw-bold text-body mb-2">Something went wrong</h2>
        <p class="text-muted small mb-4">
            An unexpected error occurred on our side. Please try again in a moment.
        </p>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary px-4 py-2.5 fw-semibold shadow-sm rounded-3">
                <i class="bi bi-speedometer2 me-1"></i> Back to Dashboard
            </a>
        {% else %}
            <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2.5 fw-semibold shadow-sm rounded-3">
                <i class="bi bi-house me-1"></i> Go Home
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
