<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - JobTrack</title>
</head>
<body>
    <h2> {{ page_title }} </h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Save Application
        </button>
    </form>

    <a href="{% url 'applications:list' %}">
        Cancel
    </a>
</body>
</html>
