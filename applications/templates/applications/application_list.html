<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - JobTrack</title>
</head>
<body>
    
    <h2>My Job Applications: </h2>

    <a href="{% url 'applications:add' %}">
        Add Application
    </a>

    {% if applications %}

            {% for application in applications %}

                <div>
                    <h3>
                        <a href="{% url 'applications:details' application.pk %}">
                            {{ application.job_title }}
                        </a>
                    </h3>
                    <p>
                        {{ application.company }}
                    </p>
                    <p>
                        Status: {{ application.job_status }}
                    </p>
                    <p>
                        Applied on: {{ application.application_date }}
                    </p>
                </div>
            {% endfor %}

    {% else %}

        <p> No applications yet. </p>

    {% endif %}

</body>
</html>
